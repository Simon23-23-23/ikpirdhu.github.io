<form id="leadForm">

<label>Nome e Cognome</label>
<input 
type="text" 
name="nome" 
placeholder="Inserisci nome e cognome"
required>


<label>Numero di telefono</label>
<input 
type="tel" 
name="telefono" 
placeholder="Inserisci numero di telefono"
required>


<label>Email</label>
<input 
type="email" 
name="email" 
placeholder="Inserisci email"
required>


<label>Qual è il tuo principale interesse?</label>

<select name="interesse" required
style="width:100%;padding:15px;border-radius:8px;border:1px solid #ccc;font-size:16px;">

<option value="">Seleziona</option>
<option value="Informazioni opportunità">Informarmi sulle opportunità</option>
<option value="Pianificare futuro">Pianificare il futuro</option>
<option value="Valutare investimenti">Valutare investimenti</option>

</select>



<label>
Qual è la tua esperienza nel mondo degli investimenti?
</label>

<select name="esperienza" required
style="width:100%;padding:15px;border-radius:8px;border:1px solid #ccc;font-size:16px;">

<option value="">Seleziona</option>
<option value="Nessuna esperienza">Nessuna esperienza</option>
<option value="Esperienza base">Esperienza base</option>
<option value="Esperienza avanzata">Esperienza avanzata</option>

</select>



<div class="check">

<input type="checkbox" required>

Ho letto e accetto l'informativa sulla privacy.

</div>



<button type="submit">
RICHIEDI INFORMAZIONI
</button>


</form>
